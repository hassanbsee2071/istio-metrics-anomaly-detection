apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mlflow-httproute
  namespace: mlflow
spec:
  hostnames:
    - mlflow.syed.stream
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kgateway-gw-internal
      namespace: kgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: mlflow-v1-mlflow
          port: 5000
          weight: 1
