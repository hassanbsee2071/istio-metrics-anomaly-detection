---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-v1-mlflow
  namespace: mlflow
  labels:
    helm.sh/chart: mlflow-3.16.1
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: mlflow-v1
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: mlflow-v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/instance: mlflow-v1
    spec:
      serviceAccountName: mlflow-v1-mlflow
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.16.1-full
          imagePullPolicy: IfNotPresent
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --allowed-hosts=mlflow.syed.stream
            - --port=5000
            - --workers=4
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-secret
                  key: uri
            - name: MLFLOW_ARTIFACTS_DESTINATION
              value: "/mlflow/artifacts"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: mlflow-storage
              mountPath: /mlflow
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlflow-v1-mlflow
        - name: tmp
          emptyDir: {}
