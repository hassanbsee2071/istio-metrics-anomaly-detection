# DO NOT commit real SSH private keys.
# Create this secret locally / in CI from your own key, e.g.:
#   kubectl create secret generic ssh-key-secret \
#     --from-file=id_rsa=~/.ssh/id_rsa \
#     --from-file=known_hosts=~/.ssh/known_hosts \
#     -n prefect
apiVersion: v1
kind: Secret
metadata:
  name: ssh-key-secret
  namespace: prefect
type: Opaque
stringData:
  id_rsa: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_WITH_YOUR_PRIVATE_KEY
    -----END OPENSSH PRIVATE KEY-----
  known_hosts: |
    github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMqqnkZvrZ0SdG6UOoqKLsabgH5C9okWi0dh2l9GKJl
