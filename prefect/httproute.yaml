apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:  
  name: prefect-httproute
  namespace: prefect
spec:
  hostnames:
  - prefect.syed.stream
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: kgateway-gw-internal
    namespace: kgateway-system
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: prefect-server
      port: 4200
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
